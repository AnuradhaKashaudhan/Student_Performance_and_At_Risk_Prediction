services:
  api:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  dashboard:
    build: .
    command:
      - streamlit
      - run
      - app/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      API_URL: http://api:8000
      PYTHONPATH: /app
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
